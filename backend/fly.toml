# Fly.io config for the Flutter Tester backend.
# `app` is set by the deploy step; this file just pins resources + the volume.

primary_region = "iad"
kill_signal    = "SIGINT"
kill_timeout   = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  FLUTTER_TESTER_DATA_DIR = "/data"
  FLUTTER_BIN             = "/opt/flutter/bin/flutter"
  PORT                    = "8080"

[[mounts]]
  source      = "tester_data"
  destination = "/data"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0
  processes           = ["app"]

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "15s"
    timeout  = "5s"
    method   = "get"
    path     = "/healthz"

[[vm]]
  size        = "performance-2x"  # 2 vCPU / 4 GB RAM — Flutter web build is RAM-hungry
  memory      = "4gb"
